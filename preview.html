<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>README preview</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; }
  .pane { padding: 32px; }
  .pane.dark { background:#0d1117; color:#e6edf3; }
  .pane.light { background:#ffffff; color:#1f2328; }
  .in { max-width: 860px; margin: 0 auto; }
  .label { font-size:11px; letter-spacing:.18em; text-transform:uppercase; opacity:.45; margin-bottom:14px; }
  img { width:100%; display:block; }
</style>
</head>
<body>
  <div class="pane dark">
    <div class="in">
      <div class="label">dark theme</div>
      <img src="assets/cover.svg" alt="NexPG">
    </div>
  </div>
  <div class="pane light">
    <div class="in">
      <div class="label">light theme</div>
      <img src="assets/cover.svg" alt="NexPG">
    </div>
  </div>
</body>
</html>
